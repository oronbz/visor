name: PR Gate

# pull_request_target runs with write access, so this job never checks out the pull request's code.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  check-contributor:
    if: github.repository == 'oronbz/visor'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check pull request intake policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const BOT_AUTHOR_IDS = new Set([
              49699333, // dependabot[bot]
              41898282, // github-actions[bot]
            ]);
            const GITHUB_ACTIONS_ID = 41898282;
            const COMMENT_MARKER = '<!-- visor:pr-gate -->';

            const pullNumber = context.payload.pull_request.number;
            const defaultBranch = context.payload.repository.default_branch;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: pullNumber });
            if (pr.state === 'closed') return;
            const prAuthor = pr.user.login;

            async function getPermission(username) {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...repo, username });
                return data.permission;
              } catch {
                return null;
              }
            }

            async function readUserList(path) {
              const { data } = await github.rest.repos.getContent({ ...repo, path, ref: defaultBranch });
              return new Set(Buffer.from(data.content, 'base64').toString('utf8')
                .split('\n')
                .map(line => line.trim().toLowerCase())
                .filter(line => line && !line.startsWith('#')));
            }

            const [maintainers, approvedContributors] = await Promise.all([
              readUserList('.github/MAINTAINERS'),
              readUserList('.github/APPROVED_CONTRIBUTORS'),
            ]);

            async function isVerifiedMaintainer(username) {
              if (!username || !maintainers.has(username.toLowerCase())) return false;
              return ['admin', 'maintain', 'write'].includes(await getPermission(username));
            }

            async function reopenedByMaintainer() {
              const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
                ...repo, issue_number: pullNumber, per_page: 100,
              });
              const latest = events.findLast(event => ['closed', 'reopened'].includes(event.event));
              return latest?.event === 'reopened' && await isVerifiedMaintainer(latest.actor?.login);
            }

            if (BOT_AUTHOR_IDS.has(pr.user.id)) return;
            if (await isVerifiedMaintainer(prAuthor)) return;
            if (approvedContributors.has(prAuthor.toLowerCase())) return;
            if (await reopenedByMaintainer()) {
              core.info(`PR #${pullNumber} was reopened by a maintainer; leaving it open`);
              return;
            }

            const body = [
              COMMENT_MARKER,
              `Hi @${prAuthor}, thanks for your interest in visor.`,
              '',
              'visor does not accept pull requests from contributors who are not listed in `.github/APPROVED_CONTRIBUTORS`.',
              '',
              'If you hit a reproducible bug, report it with the bug report form. For something visor doesn\'t do, use the feature request form, or build it as a Plugin in your own repo. A report doesn\'t reserve the work or authorize a pull request.',
              '',
              'If a maintainer wants this implementation, they can reopen the pull request. Reopening by anyone else closes it again.',
              '',
              `See https://github.com/${repo.owner}/${repo.repo}/blob/${defaultBranch}/CONTRIBUTING.md for the contribution policy.`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...repo, issue_number: pullNumber, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.id === GITHUB_ACTIONS_ID && comment.body?.includes(COMMENT_MARKER));
            if (!existing) {
              await github.rest.issues.createComment({ ...repo, issue_number: pullNumber, body });
            }
            await github.rest.pulls.update({ ...repo, pull_number: pullNumber, state: 'closed' });

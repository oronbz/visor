name: Feature request
description: Ask for something visor doesn't do.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start:** read [CONTRIBUTING.md](https://github.com/oronbz/visor/blob/main/CONTRIBUTING.md) and check [`.out-of-scope/`](https://github.com/oronbz/visor/tree/main/.out-of-scope) for what visor has decided not to do.

        A new Widget type may not need to be in visor at all: a [Plugin](https://github.com/oronbz/visor#plugins) can add it from your own repo.

        A request doesn't reserve the work or authorize a pull request. Keep it short, write it for a human, and describe the problem, not an implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: How often you hit this and what it costs you.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: Optional. What you'd like to see, from a user's point of view.
